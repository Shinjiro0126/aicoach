<svg width="1024" height="1024" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- ホトリ アプリアイコンv2: コーチ姿バストを正方形全面グラデに配置 -->
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC5E8"/>
      <stop offset="0.58" stop-color="#2E9FD6"/>
      <stop offset="1" stop-color="#17638F"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="0.5" cy="0.44" r="0.62">
